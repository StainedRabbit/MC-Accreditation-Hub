# Restricted test template only. Replace placeholders with School IT values.
# Include this file once within nginx's http context. Missing allow file prevents startup.
log_format mc_hub_test_no_args '$remote_addr - $remote_user [$time_local] '
    '"$request_method $uri $server_protocol" $status $body_bytes_sent';

server {
    listen REPLACE_WITH_TEST_INTERNAL_IP:443 ssl http2;
    server_name REPLACE_WITH_TEST_HOSTNAME;
    include /etc/nginx/mc-hub-test-client-allow.conf;
    access_log /var/log/nginx/mc-hub-test.access.log mc_hub_test_no_args;

    ssl_certificate REPLACE_WITH_TEST_CERTIFICATE_PATH;
    ssl_certificate_key REPLACE_WITH_TEST_PRIVATE_KEY_PATH;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;

    client_max_body_size 27m;
    root /srv/mc-accreditation/app/frontend/dist;
    index index.html;

    location /static/ {
        alias /srv/mc-accreditation/app/backend/staticfiles/;
        access_log off;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        # Exactly one client address: discard any inbound forwarding chain.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header X-Forwarded-Port "";
        proxy_read_timeout 70s;
    }

    location / { try_files $uri $uri/ /index.html; }
}
