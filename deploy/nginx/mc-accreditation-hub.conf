# This file is included inside Nginx's http context. Never log $request or
# $request_uri here: both contain query strings from inbound requests.
log_format mc_hub_no_args '$remote_addr - $remote_user [$time_local] '
    '"$request_method $uri $server_protocol" $status $body_bytes_sent';

server {
    listen 80;
    server_name accreditation.example.edu;
    access_log /var/log/nginx/mc-accreditation-hub.access.log mc_hub_no_args;
    return 301 https://$host$uri;
}

server {
    listen 443 ssl http2;
    server_name accreditation.example.edu;
    access_log /var/log/nginx/mc-accreditation-hub.access.log mc_hub_no_args;

    # Replace with school-managed certificate paths.
    ssl_certificate /etc/ssl/certs/accreditation.example.edu.pem;
    ssl_certificate_key /etc/ssl/private/accreditation.example.edu.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;

    client_max_body_size 27m;
    root /srv/mc-accreditation/app/frontend/dist;
    index index.html;

    location /static/ {
        alias /srv/mc-accreditation/app/backend/staticfiles/;
        access_log off;
        expires 7d;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 70s;
    }

    # Never add an alias or location for PRIVATE_MEDIA_ROOT.
    location / { try_files $uri $uri/ /index.html; }
}
